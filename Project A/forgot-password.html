<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forgot password</title>
  <link rel="stylesheet" href="auth.css">
  <style>
    /* Small override so this page looks like the register modal layout */
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .fp-card { width: 360px; max-width:94%; }
    .fp-card .box { padding:18px; border-radius:10px; }
    .fp-note { font-size:13px; color: rgba(255,255,255,0.85); margin-top:8px; text-align:center; }
  </style>
</head>
<body>
  <img class="bg-img" src="./images/valorant-305kescxw5dpup7y.jpg" alt="" aria-hidden="true">
  <div class="fp-card">
    <div class="box" role="dialog" aria-labelledby="fpTitle">
      <h2 id="fpTitle">Forgot password</h2>
      <form id="fpForm">
        <label for="email">Enter your email</label>
        <input id="email" type="email" placeholder="you@example.com" required>
        <button type="submit" class="primary">Send reset link</button>
      </form>
      <p class="fp-note">This is a demo — the reset page will open so you can set a new password.</p>
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById('fpForm');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) return alert('Enter a valid email.');

        // create a short fake token (demo)
        const token = Math.random().toString(36).slice(2, 12);
        // Navigate to the reset page in the same popup, passing token+email in query (demo)
        const url = 'reset-password.html?token=' + encodeURIComponent(token) + '&email=' + encodeURIComponent(email);
        location.href = url;
      });
    })();
  </script>
</body>
</html>
