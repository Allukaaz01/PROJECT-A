<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset password</title>
  <link rel="stylesheet" href="auth.css">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
    .rp-card { width: 420px; max-width:94%; }
    .rp-note { font-size:13px; color: rgba(255,255,255,0.85); margin-top:8px; text-align:center; }
    .input-with-status { position: relative; }
    .input-with-status input { padding-right:46px; }
    .pw-status {
      position:absolute; right:8px; top:50%; transform:translateY(-50%);
      width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
      color:#fff; pointer-events:none; box-shadow:0 4px 10px rgba(0,0,0,0.3);
    }
    .pw-status.invalid { background:#c62828; }
    .pw-status.valid { background:#2e7d32; transform:translateY(-50%) scale(1.03); }
    #doReset[disabled]{opacity:.66;cursor:not-allowed;}
  </style>
</head>
<body>
  <img class="bg-img" src="./images/valorant-305kescxw5dpup7y.jpg" alt="" aria-hidden="true">
  <div class="rp-card">
    <div class="box" role="dialog" aria-labelledby="rpTitle">
      <h2 id="rpTitle">Create new password</h2>

      <p id="rpInfo" style="margin:6px 0 12px 0; color:rgba(255,255,255,0.9); font-size:14px;"></p>

      <form id="resetForm">
        <label for="newPassword">New password</label>
        <div class="input-with-status">
          <input type="password" id="newPassword" required autocomplete="new-password">
          <span class="pw-status invalid" id="resetPwStatus" aria-hidden="true">✕</span>
        </div>

        <label for="confirmNew">Confirm password</label>
        <div class="input-with-status">
          <input type="password" id="confirmNew" required autocomplete="new-password">
          <span class="pw-status invalid" id="resetConfirmStatus" aria-hidden="true">✕</span>
        </div>

        <button type="submit" id="doReset" class="primary" disabled>Reset password</button>
      </form>

      <p class="rp-note">Passwords must be 8–18 characters, include at least one uppercase letter and one special character.</p>
    </div>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const token = params.get('token') || '';
      const email = params.get('email') || '';
      const rpInfo = document.getElementById('rpInfo');
      if (email) rpInfo.textContent = 'Resetting password for ' + email;

      // elements
      const newPwd = document.getElementById('newPassword');
      const newConfirm = document.getElementById('confirmNew');
      const resetPwStatus = document.getElementById('resetPwStatus');
      const resetConfirmStatus = document.getElementById('resetConfirmStatus');
      const doResetBtn = document.getElementById('doReset');
      const form = document.getElementById('resetForm');

      const strongPwRegex = /^(?=.{8,18}$)(?=.*[A-Z])(?=.*[^A-Za-z0-9]).*$/;

      function updateResetPwStatus() {
        const ok = strongPwRegex.test(newPwd.value);
        if (ok) { resetPwStatus.classList.remove('invalid'); resetPwStatus.classList.add('valid'); resetPwStatus.textContent = '✓'; }
        else { resetPwStatus.classList.remove('valid'); resetPwStatus.classList.add('invalid'); resetPwStatus.textContent = '✕'; }
      }
      function updateResetConfirmStatus() {
        const match = newConfirm.value !== '' && newPwd.value === newConfirm.value;
        if (match) { resetConfirmStatus.classList.remove('invalid'); resetConfirmStatus.classList.add('valid'); resetConfirmStatus.textContent = '✓'; }
        else { resetConfirmStatus.classList.remove('valid'); resetConfirmStatus.classList.add('invalid'); resetConfirmStatus.textContent = '✕'; }
      }
      function updateDoResetButton() {
        const allGood = strongPwRegex.test(newPwd.value) && newPwd.value === newConfirm.value;
        doResetBtn.disabled = !allGood;
      }

      newPwd.addEventListener('input', function () { updateResetPwStatus(); updateResetConfirmStatus(); updateDoResetButton(); });
      newConfirm.addEventListener('input', function () { updateResetConfirmStatus(); updateDoResetButton(); });

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (!strongPwRegex.test(newPwd.value) || newPwd.value !== newConfirm.value) {
          alert('Please fix password fields.');
          return;
        }

        // Demo behavior:
        // If opened from a parent window, notify parent that reset succeeded, then close popup.
        const payload = { type: 'reset-success', email: email, token: token };
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage(payload, '*');
            alert('Password updated (demo). This window will now close.');
            window.close();
            return;
          }
        } catch (err) {
          // proceed to fallback
        }

        // Fallback: redirect parent or just show a message and navigate to index
        alert('Password updated (demo). Redirecting to home.');
        location.href = 'index.html';
      });

      // initial UI update
      updateResetPwStatus();
      updateResetConfirmStatus();
      updateDoResetButton();
    })();
  </script>
</body>
</html>
